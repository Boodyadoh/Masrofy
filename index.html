.empty{text-align:center;color:var(--muted);padding:20px}
.ai-out{white-space:pre-wrap;font-size:.9rem;background:var(--sunk);border-radius:10px;padding:10px}
.scan{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-style:dashed;border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--ok-soft)}
.rline{display:grid;grid-template-columns:auto minmax(0,1fr) 5.6rem;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

const NOW=new Date(),CUR=mkey(NOW);
function defaultData(){

  return{version:1,schema:2,settings:{spendLimitPct:80,level:"mid",theme:"auto",apiKey:"",aiProvider:"openai",openaiKey:"",openaiModel:"gpt-6-luna",prices,pricesNote:"أسعار نوفمبر 2026"},
    family:[],goal:{name:"صندوق طوارئ",amount:0},months:{}};

function G(name,items){return{id:uid(),name,items:items.map(([n,t])=>({id:uid(),name:n,type:t||"",plan:0}))}}
function templateGroups(){return[
  G("السكن",[["إيجار"],["قسط الشقة"],["صيانة واتحاد ملاك"]]),
  G("الأكل",FOOD_ITEMS),
  G("الفواتير والاشتراكات",[["كهرباء"],["مياه"],["غاز طبيعي"],["إنترنت البيت"],["باقات الموبايل"],["اشتراكات AI"]]),
  G("العربية",[["قسط العربية"],["بنزين"],["صيانة دورية"],["تأمين وترخيص (مقسومين على 12)"]]),
  G("الأطفال",[["حضانة"],["كيدز إريا وأنشطة"],["لبس ولعب"]]),
  G("خروجات وترفيه",[["خروجات"],["كافيه"],["مطاعم ودليفري"]]),
  G("مصاريف شخصية",[["لبس"]]),
  G("طوارئ",[["طوارئ"]])
]}
/* v1 -> v2: new food items and trimmed groups, keeping every amount and recorded expense */
function migrate(){
  if((D.schema||1)>=2)return;
  Object.values(D.months).forEach(m=>{
    const used=id=>(m.entries||[]).some(e=>e.item===id);
    const find=n=>m.groups.find(g=>g.name===n);
    const drop=(g,n)=>{if(!g)return;g.items=g.items.filter(it=>it.name!==n||used(it.id)||val(it.plan)>0)};
    const food=find("البيت والأكل");
    if(food){
      const old=food.items.slice(),take=n=>{const i=old.findIndex(it=>it.name===n);return i<0?null:old.splice(i,1)[0]};
      const carry={"لحوم وفراخ":"لحوم وفراخ","لبن":"لبن وجبن وبيض","بقالة وسوبرماركت":"رز ومكرونة وبقوليات","خضار وفاكهة":"خضار وفاكهة","منظفات":"منظفات البيت","مياه شرب وأنبوبة":"مياه شرب وأنبوبة"};
      const byNew={};Object.entries(carry).forEach(([o,n])=>{const it=take(o);if(it)byNew[n]=it});
      food.name="الأكل";
      food.items=FOOD_ITEMS.map(([n,t])=>{const it=byNew[n];return it?Object.assign(it,{name:n,type:t||""}):{id:uid(),name:n,type:t||"",plan:0}}).concat(old);
    }
    drop(find("الأطفال"),"لبن أطفال وبامبرز");
    const out=find("خروجات وترفيه");if(out&&!out.items.some(it=>it.name==="كافيه"))out.items.splice(1,0,{id:uid(),name:"كافيه",type:"",plan:0});
    drop(find("مصاريف شخصية"),"حلاقة وعناية");
    const em=find("طوارئ ومناسبات");if(em){drop(em,"هدايا ومناسبات");em.name="طوارئ";em.items.forEach(it=>{if(it.name==="طوارئ وعلاج")it.name="طوارئ"})}
  });
  D.family.forEach(p=>{delete p.formula;delete p.diapers});
  D.schema=2;save();
}
let D=null,curKey=CUR,tab="month",editMode=false;
const Bridge=window.AndroidBridge||null;
function load(){
  let raw="";try{raw=Bridge?Bridge.load():(localStorage.getItem("masrofy")||"")}catch(e){}
  try{D=raw?JSON.parse(raw):null}catch(e){D=null}
  if(!D||!D.months){D=defaultData()}
  const def=defaultData(),dp=def.settings.prices,sp=(D.settings&&D.settings.prices)||{};D.settings=Object.assign(def.settings,D.settings);D.settings.prices=Object.assign(dp,sp);
  D.family=D.family||[];if(!D.schema&&!Object.keys(D.months).length)D.schema=2;
  migrate();ensureMonth(CUR);
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,300)}
function saveNow(){const s=JSON.stringify(D);try{if(Bridge)Bridge.save(s);else localStorage.setItem("masrofy",s)}catch(e){toast("ما اتحفظش! جرّب تاني")}}
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(saveT);saveNow()}});
/* a new month copies the latest earlier month's plan, with nothing spent yet */
function ensureMonth(k){
  if(D.months[k])return D.months[k];
  const prev=Object.keys(D.months).filter(x=>x<k).sort().pop()||Object.keys(D.months).sort().pop();
  let m;
  if(prev){const p=D.months[prev];m={salary:p.salary,extra:p.extra,savingsPct:p.savingsPct,groups:JSON.parse(JSON.stringify(p.groups)),entries:[],saved:false,savedAmount:0}}
  else m={salary:0,extra:0,savingsPct:10,groups:templateGroups(),entries:[],saved:false,savedAmount:0};
  m.created=new Date().toISOString();D.months[k]=m;save();return m;
}
const M=()=>D.months[curKey];

/* ================= calculations ================= */
function estimates(){
  const out={};Object.keys(TYPE_ITEMS).forEach(t=>out[t]=0);
  const P=D.settings.prices,fam=D.family;if(!fam.length)return null;
  fam.forEach(p=>{
    const g=ageGroup(+p.age||0),n=NORMS[g];
    Object.keys(TYPE_ITEMS).forEach(t=>TYPE_ITEMS[t].forEach(k=>{if(n[k])out[t]+=n[k]*(P[k]||0)}));
    if(p.extraMilk)out.dairy+=8*(P.milk||0);
  });
  const big=fam.length>4?1.3:1;
  out.condiments=(P.condiments||0)*big;out.cleaning=(P.cleaning||0)*big;
  const mul=LEVELS[D.settings.level].m;Object.keys(out).forEach(t=>out[t]=Math.round(out[t]*mul/50)*50);
  return out;
}
function judge(amount,est){if(!est||!amount)return null;const r=amount/est;return r<=1?"ok":r<=1.15?"warn":"bad"}
function calc(m){
  m=m||M();
  const income=val(m.salary)+val(m.extra);
  const savings=income*val(m.savingsPct)/100;
  const spentBy={};let actual=0;(m.entries||[]).forEach(e=>{spentBy[e.item]=(spentBy[e.item]||0)+e.amount;actual+=e.amount});
  let planned=0,inst=0;const per=m.groups.map(g=>{let pl=0,ac=0;g.items.forEach(it=>{pl+=val(it.plan);ac+=spentBy[it.id]||0;if(/قسط|أقساط|اقساط/.test(it.name))inst+=val(it.plan)});planned+=pl;return{pl,ac}});
  const limit=income*val(D.settings.spendLimitPct)/100;
  return{income,savings,planned,actual,per,spentBy,inst,limit,remaining:income-savings-planned};
}
function daysInfo(k){const[y,mo]=k.split("-").map(Number);const days=new Date(y,mo,0).getDate();if(k!==CUR)return{days,day:k<CUR?days:0,left:k<CUR?0:days};const day=NOW.getDate();return{days,day,left:days-day+1}}

/* ================= views ================= */
function setTop(title,sub,showEdit){$("#title").textContent=title;$("#sub").textContent=sub||"";$("#editBtn").hidden=!showEdit;$("#editBtn").textContent=editMode?"تم":"تعديل"}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  $("#fab").hidden=tab!=="month";
  const main=$("#main");main.textContent="";main.scrollTop=0;
  ({month:viewMonth,history:viewHistory,family:viewFamily,settings:viewSettings})[tab](main);
  applyTheme();
}
function moneyInput(value,onCommit,attrs){
  const i=el("input",Object.assign({class:"money",inputmode:"tel",value:value?String(value):"",placeholder:"0"},attrs||{}));
  i.addEventListener("focus",()=>{if(i.dataset.raw)i.value=i.dataset.raw});
  i.addEventListener("change",()=>{const n=calcExpr(i.value);if(isNaN(n)){toast("الحسبة مش مظبوطة");return}onCommit(n);i.value=n?fmt(n):""});
  if(value)i.value=fmt(value);
  return i;
}

  /* alerts */

window.__httpCb={};
window.__http=function(id,status,text){const f=window.__httpCb[id];delete window.__httpCb[id];if(f)f(status,text)};
function post(url,headers,body){return new Promise(res=>{
  if(Bridge&&Bridge.httpPost){const id=uid();window.__httpCb[id]=(s,t)=>res({status:s,text:t});Bridge.httpPost(url,JSON.stringify(headers),body,id)}
  else fetch(url,{method:"POST",headers,body}).then(async r=>res({status:r.status,text:await r.text()})).catch(e=>res({status:0,text:String(e)}));
})}
const useOpenAI=()=>D.settings.aiProvider!=="claude";
const hasAIKey=()=>useOpenAI()?!!D.settings.openaiKey:!!D.settings.apiKey;
async function ai(prompt,useSearch,images){
  if(!useOpenAI())return claude(prompt,useSearch,images);
  if(useSearch)throw new Error("التحديث من النت شغال مع Claude بس. مع ChatGPT الأسعار بتتحدث لوحدها من الإيصالات اللي بتسجلها، أو عدّلها بإيدك.");
  const key=D.settings.openaiKey;if(!key)throw new Error("حط مفتاح OpenAI API الأول من الإعدادات");
  const content=[{type:"text",text:prompt}].concat((images||[]).map(d=>({type:"image_url",image_url:{url:"data:image/jpeg;base64,"+d}})));
  const body={model:D.settings.openaiModel||"gpt-6-luna",max_completion_tokens:4000,messages:[{role:"user",content}]};
  const r=await post("https://api.openai.com/v1/chat/completions",{"content-type":"application/json","authorization":"Bearer "+key},JSON.stringify(body));
  let j;try{j=JSON.parse(r.text)}catch(e){throw new Error("مفيش رد. اتأكد من النت")}
  if(r.status!==200)throw new Error((j.error&&j.error.message)||("خطأ "+r.status));
  const c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  return Array.isArray(c)?c.map(x=>x.text||"").join("\n"):String(c||"");
}
async function claude(prompt,useSearch,images){
  const key=D.settings.apiKey;if(!key)throw new Error("حط مفتاح الـAPI الأول");
  const content=images&&images.length?images.map(d=>({type:"image",source:{type:"base64",media_type:"image/jpeg",data:d}})).concat([{type:"text",text:prompt}]):prompt;
  const body={model:"claude-sonnet-5-5",max_tokens:4000,messages:[{role:"user",content}]};
  if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:6}];
  const r=await post("https://api.anthropic.com/v1/messages",{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},JSON.stringify(body));
  let j;try{j=JSON.parse(r.text)}catch(e){throw new Error("مفيش رد. اتأكد من النت")}
  if(r.status!==200)throw new Error((j.error&&j.error.message)||("خطأ "+r.status));
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
async function aiPrices(out){
  out.hidden=false;out.textContent="بيدوّر على الأسعار… ممكن ياخد دقيقة";
  const keys=PRICE_DEFS.map(([k,t])=>`${k}: ${t}`).join("\n");
  try{
    const txt=await ai(`ابحث على النت عن أحدث أسعار المستهلك في مصر النهارده بالجنيه المصري للسلع دي، واستخدم أحدث مصادر إخبارية مصرية:\n${keys}\n\nرد بـ JSON بس من غير أي كلام تاني، المفاتيح بالإنجليزي زي ما هي والقيم أرقام، وضيف مفتاح "note" فيه تاريخ الأسعار بالعربي في جملة قصيرة.`,true);

}
