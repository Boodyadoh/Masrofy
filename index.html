<style>
/* Masrofy: one-hand phone layout. Sticky month header, content cards, bottom tab bar, sheets for input. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#F4F7F5; --ink:#13201B; --muted:#5B6A64; --line:#D8E1DC;
  --accent:#0E7A5C; --accent-ink:#FFFFFF; --gold:#A9740F; --gold-soft:#F6EBD3;
  --danger:#B83B26; --danger-soft:#F8E1DB; --warn:#9A6A00; --warn-soft:#FBF0D2; --ok-soft:#DDF0E8;

}

  --danger:#F0806B; --danger-soft:#3D1F19; --warn:#E8C060; --warn-soft:#3A3115; --ok-soft:#173329;
  --c1:#3DBB8F; --c2:#6AA6E8; --c3:#AE8AE6; --c4:#EE9A4A; --c5:#E57AA6; --c6:#93C25A; --c7:#9AA6B5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211D; --sunk:#121A17; --ink:#E6EEEA; --muted:#97A8A1; --line:#2A3833;
  --accent:#3DBB8F; --accent-ink:#0B1411; --gold:#E2B04B; --gold-soft:#3A2F17;
  --danger:#F0806B; --danger-soft:#3D1F19; --warn:#E8C060; --warn-soft:#3A3115; --ok-soft:#173329;
  --c1:#3DBB8F; --c2:#6AA6E8; --c3:#AE8AE6; --c4:#EE9A4A; --c5:#E57AA6; --c6:#93C25A; --c7:#9AA6B5; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.money{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.muted{color:var(--muted)} small{font-size:.8rem}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.danger{color:var(--danger);border-color:var(--danger)}
.ghost{background:transparent;border-color:transparent}
h1,h2,h3{margin:0;font-weight:700}
h2{font-size:1.05rem} h3{font-size:.95rem}

.app{display:flex;flex-direction:column;height:100%}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.top h1{font-size:1.25rem}
.top .sub{font-size:.78rem;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
main>*{flex-shrink:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;border-radius:0;background:transparent;padding:10px 4px 12px;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}

.fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:7;border-radius:99px;padding:12px 20px;box-shadow:0 6px 18px rgba(0,0,0,.18)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-size:.75rem;color:var(--muted)}
.kpi b{font-size:1.15rem}
.kpi.gold b{color:var(--gold)}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;position:relative}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem}
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{border-radius:10px;padding:8px 12px;font-size:.88rem;background:var(--sunk)}
.alert.bad{background:var(--danger-soft);color:var(--ink)}
.alert.warn{background:var(--warn-soft)}
.alert.good{background:var(--ok-soft)}

.group{padding:0;gap:0;overflow:hidden}
.g-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.g-head .sw{width:10px;height:10px;border-radius:3px;flex:none}
.g-head .t{flex:1;font-weight:700;min-width:0}

.g-bar{height:3px;background:var(--sunk)} .g-bar i{display:block;height:100%}
.item{display:grid;grid-template-columns:minmax(0,1fr) 6.6rem 5.6rem;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}

.badge{display:inline-block;margin-top:3px;font-size:.72rem;padding:1px 8px;border-radius:99px;font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--accent)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}
.edit .item{grid-template-columns:minmax(0,1fr) 6.6rem 2.2rem}
.x{border:0;background:transparent;color:var(--muted);padding:6px;font-size:1.2rem;line-height:1}
.addrow{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;color:var(--muted);padding:10px;width:100%}
.colhead{display:grid;grid-template-columns:minmax(0,1fr) 6.6rem 5.6rem;gap:8px;padding:6px 14px 0;font-size:.72rem;color:var(--muted)}
.edit .colhead{grid-template-columns:minmax(0,1fr) 6.6rem 2.2rem}

.hist{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.hrow .chk{width:22px;height:22px}
.hrow .mn{font-weight:700}
.hrow .tg{font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--ok-soft);color:var(--accent);margin-inline-start:6px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.member{display:grid;grid-template-columns:minmax(0,1fr) 4.6rem 2.2rem;gap:8px;align-items:center}
.flags{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;grid-column:1 / -1}
.flags label{display:flex;gap:6px;align-items:center}
.flags input{width:auto}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.est{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:.88rem}
.prices{display:grid;grid-template-columns:minmax(0,1fr) 6rem;gap:6px 10px;align-items:center;font-size:.85rem}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:center}
.display{background:var(--sunk);border-radius:12px;padding:10px 14px;text-align:left;direction:ltr}
.display .expr{font-size:1rem;color:var(--muted);min-height:1.4em;word-break:break-all}
.display .res{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.keys button{padding:14px 0;font-size:1.2rem;font-weight:600;background:var(--sunk);border-color:transparent}
.keys .op{color:var(--accent)}
.keys .eq{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;font-size:.85rem;border-radius:99px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.entries{display:flex;flex-direction:column;gap:6px}
.entry{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--sunk);border-radius:10px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.88rem;z-index:30}
.empty{text-align:center;color:var(--muted);padding:20px}
.ai-out{white-space:pre-wrap;font-size:.9rem;background:var(--sunk);border-radius:10px;padding:10px}
</style>
</head>

<script>
(function(){
"use strict";
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const AR="٠١٢٣٤٥٦٧٨٩",FA="۰۱۲۳۴۵۶۷۸۹";
function normDigits(s){return String(s==null?"":s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/٫/g,".").replace(/[×xX]/g,"*").replace(/÷/g,"/").replace(/[−–]/g,"-").replace(/,/g,"")}
/* safe calculator: numbers, + - * / ( ) . */
function calcExpr(src){
  const s=normDigits(src).replace(/\s+/g,"");if(!s)return 0;
  if(!/^[\d+\-*/().]+$/.test(s))return NaN;
  let i=0;
  function num(){let st=i;while(i<s.length&&/[\d.]/.test(s[i]))i++;const v=parseFloat(s.slice(st,i));if(isNaN(v))throw 0;return v}
  function fac(){if(s[i]==="-"){i++;return -fac()}if(s[i]==="+"){i++;return fac()}if(s[i]==="("){i++;const v=expr();if(s[i]!==")")throw 0;i++;return v}return num()}
  function term(){let v=fac();while(s[i]==="*"||s[i]==="/"){const o=s[i++];const r=fac();v=o==="*"?v*r:v/r}return v}
  function expr(){let v=term();while(s[i]==="+"||s[i]==="-"){const o=s[i++];const r=term();v=o==="+"?v+r:v-r}return v}
  try{const v=expr();if(i!==s.length||!isFinite(v))return NaN;return Math.round(v*100)/100}catch(e){return NaN}
}
const val=x=>{const n=calcExpr(x);return isNaN(n)?0:n};
const fmt=n=>Math.round(n||0).toLocaleString("en-US");
const COLORS=["--c1","--c2","--c3","--c4","--c5","--c6","--c7"];
const col=i=>`var(${COLORS[i%COLORS.length]})`;
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const mkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const mlabel=k=>{const[y,m]=k.split("-");return `${MONTHS[+m-1]} ${y}`};
function el(tag,attrs,kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="text")e.textContent=v;else if(k==="value")e.value=v;else if(k==="checked")e.checked=!!v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}(kids||[]).forEach(c=>c!=null&&e.appendChild(typeof c==="string"?document.createTextNode(c):c));return e}
function toast(t){const d=el("div",{class:"toast",text:t});document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ================= prices & norms ================= */
/* Default prices in EGP, researched Nov 2026; editable in settings. "est" marks a rough estimate. */
const PRICE_DEFS=[
 ["beef","لحمة كندوز (كيلو)",445],["chicken","فراخ بيضا (كيلو)",80],["rice","رز (كيلو)",35],["pasta","مكرونة (كيلو)",28],
 ["oil","زيت (لتر)",100],["sugar","سكر (كيلو)",38],["eggs","بيضة واحدة",4.9],["tea","شاي (كيلو)",262],
 ["milk","لبن معبأ (لتر) - تقديري",45],["cheese","جبنة بيضا (كيلو) - تقديري",180],["bread","رغيف عيش سوق حر - تقديري",2.5],
 ["veg","خضار (متوسط الكيلو) - تقديري",25],["fruit","فاكهة (متوسط الكيلو) - تقديري",40],
 ["formula","علبة لبن أطفال صناعي - تقديري",350],["diapers","بامبرز للطفل في الشهر - تقديري",1400],["cleaning","منظفات للبيت في الشهر - تقديري",700]
];
const LEVELS={econ:{t:"اقتصادي",m:.85},mid:{t:"متوسط",m:1},comfy:{t:"مريح",m:1.3}};
/* monthly quantities per person by age group */
const NORMS={
 adult:{beef:2,chicken:3,rice:3,pasta:1.5,oil:1.2,sugar:1.5,eggs:30,tea:.15,milk:3,cheese:1,bread:60,veg:15,fruit:6},
 teen:{beef:2,chicken:3,rice:3.5,pasta:2,oil:1.2,sugar:1.5,eggs:30,tea:.05,milk:6,cheese:1,bread:60,veg:15,fruit:8},
 child:{beef:1,chicken:2,rice:2,pasta:1,oil:.6,sugar:1,eggs:20,tea:0,milk:6,cheese:.7,bread:30,veg:10,fruit:6},
 toddler:{beef:.5,chicken:1,rice:1,pasta:.5,oil:.3,sugar:.3,eggs:15,tea:0,milk:10,cheese:.4,bread:10,veg:6,fruit:5},
 infant:{}
};
const TYPE_ITEMS={groceries:["rice","pasta","oil","sugar","eggs","tea","cheese","bread"],meat:["beef","chicken"],produce:["veg","fruit"],dairy:["milk"],baby:["formula","diapers"],cleaning:["cleaning"]};
const TYPE_LABEL={groceries:"بقالة",meat:"لحوم وفراخ",produce:"خضار وفاكهة",dairy:"لبن",baby:"لبن أطفال وبامبرز",cleaning:"منظفات"};
const ageGroup=a=>a<1?"infant":a<4?"toddler":a<13?"child":a<18?"teen":"adult";

/* ================= state ================= */
const NOW=new Date(),CUR=mkey(NOW);
function defaultData(){
  const prices={};PRICE_DEFS.forEach(([k,,p])=>prices[k]=p);
  return{version:1,settings:{spendLimitPct:80,level:"mid",theme:"auto",apiKey:"",prices,pricesNote:"أسعار نوفمبر 2026"},
    family:[],goal:{name:"صندوق طوارئ",amount:0},months:{}};
}
function G(name,items){return{id:uid(),name,items:items.map(([n,t])=>({id:uid(),name:n,type:t||"",plan:0}))}}
function templateGroups(){return[
  G("السكن",[["إيجار"],["قسط الشقة"],["صيانة واتحاد ملاك"]]),
  G("البيت والأكل",[["بقالة وسوبرماركت","groceries"],["لحوم وفراخ","meat"],["خضار وفاكهة","produce"],["لبن","dairy"],["منظفات","cleaning"],["مياه شرب وأنبوبة"]]),
  G("الفواتير والاشتراكات",[["كهرباء"],["مياه"],["غاز طبيعي"],["إنترنت البيت"],["باقات الموبايل"],["اشتراكات AI"]]),
  G("العربية",[["قسط العربية"],["بنزين"],["صيانة دورية"],["تأمين وترخيص (مقسومين على 12)"]]),
  G("الأطفال",[["حضانة"],["كيدز إريا وأنشطة"],["لبن أطفال وبامبرز","baby"],["لبس ولعب"]]),
  G("خروجات وترفيه",[["خروجات"],["مطاعم ودليفري"]]),
  G("مصاريف شخصية",[["لبس"],["حلاقة وعناية"]]),
  G("طوارئ ومناسبات",[["طوارئ وعلاج"],["هدايا ومناسبات"]])
]}
let D=null,curKey=CUR,tab="month",editMode=false;
const Bridge=window.AndroidBridge||null;
function load(){
  let raw="";try{raw=Bridge?Bridge.load():(localStorage.getItem("masrofy")||"")}catch(e){}
  try{D=raw?JSON.parse(raw):null}catch(e){D=null}
  if(!D||!D.months){D=defaultData()}
  const def=defaultData();D.settings=Object.assign(def.settings,D.settings);D.settings.prices=Object.assign(def.settings.prices,D.settings.prices||{});
  ensureMonth(CUR);
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,300)}
function saveNow(){const s=JSON.stringify(D);try{if(Bridge)Bridge.save(s);else localStorage.setItem("masrofy",s)}catch(e){toast("ما اتحفظش! جرّب تاني")}}
document.addEventListener("visibilitychange",()=>{if(document.hidden){clearTimeout(saveT);saveNow()}});
/* a new month copies the latest earlier month's plan, with nothing spent yet */
function ensureMonth(k){
  if(D.months[k])return D.months[k];
  const prev=Object.keys(D.months).filter(x=>x<k).sort().pop()||Object.keys(D.months).sort().pop();
  let m;
  if(prev){const p=D.months[prev];m={salary:p.salary,extra:p.extra,savingsPct:p.savingsPct,groups:JSON.parse(JSON.stringify(p.groups)),entries:[],saved:false,savedAmount:0}}
  else m={salary:0,extra:0,savingsPct:10,groups:templateGroups(),entries:[],saved:false,savedAmount:0};
  m.created=new Date().toISOString();D.months[k]=m;save();return m;
}
const M=()=>D.months[curKey];

/* ================= calculations ================= */
function estimates(){
  const out={};Object.keys(TYPE_ITEMS).forEach(t=>out[t]=0);
  const P=D.settings.prices,fam=D.family;if(!fam.length)return null;
  fam.forEach(p=>{
    const g=ageGroup(+p.age||0),n=NORMS[g];
    Object.keys(TYPE_ITEMS).forEach(t=>TYPE_ITEMS[t].forEach(k=>{if(n[k])out[t]+=n[k]*(P[k]||0)}));
    if(p.extraMilk)out.dairy+=8*(P.milk||0);
    if(p.formula)out.baby+=4*(P.formula||0);
    if(p.diapers)out.baby+=P.diapers||0;
  });
  out.cleaning=(P.cleaning||0)*(fam.length>4?1.3:1);
  const mul=LEVELS[D.settings.level].m;Object.keys(out).forEach(t=>out[t]=Math.round(out[t]*mul/50)*50);
  return out;
}
function judge(amount,est){if(!est||!amount)return null;const r=amount/est;return r<=1?"ok":r<=1.15?"warn":"bad"}
function calc(m){
  m=m||M();
  const income=val(m.salary)+val(m.extra);
  const savings=income*val(m.savingsPct)/100;
  const spentBy={};let actual=0;(m.entries||[]).forEach(e=>{spentBy[e.item]=(spentBy[e.item]||0)+e.amount;actual+=e.amount});
  let planned=0,inst=0;const per=m.groups.map(g=>{let pl=0,ac=0;g.items.forEach(it=>{pl+=val(it.plan);ac+=spentBy[it.id]||0;if(/قسط|أقساط|اقساط/.test(it.name))inst+=val(it.plan)});planned+=pl;return{pl,ac}});
  const limit=income*val(D.settings.spendLimitPct)/100;
  return{income,savings,planned,actual,per,spentBy,inst,limit,remaining:income-savings-planned};
}
function daysInfo(k){const[y,mo]=k.split("-").map(Number);const days=new Date(y,mo,0).getDate();if(k!==CUR)return{days,day:k<CUR?days:0,left:k<CUR?0:days};const day=NOW.getDate();return{days,day,left:days-day+1}}

function moneyInput(value,onCommit,attrs){

  i.addEventListener("focus",()=>{if(i.dataset.raw)i.value=i.dataset.raw});

  if(value)i.value=fmt(value);

}

  const file=el("input",{type:"file",accept:"application/json,text/plain,*/*",hidden:true,onchange:e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.months)throw 0;confirmSheet("تستبدل كل الداتا اللي على الموبايل بالنسخة دي؟","استبدل",()=>{D=d;load2();save();curKey=CUR;tab="month";render();toast("اترجّعت")})}catch(x){toast("الملف ده مش نسخة من مصروفي")}};r.readAsText(f)}});
  main.appendChild(el("section",{class:"card"},[el("h2",{text:"الداتا"}),el("small",{class:"muted",text:"كل حاجة محفوظة جوه الموبايل. اعمل نسخة احتياطي من وقت للتاني."}),
    el("div",{class:"grid2"},[el("button",{text:Bridge?"حفظ نسخة في Downloads":"نزّل نسخة",onclick:()=>exportData(true)}),el("button",{text:"ابعت نسخة (شير)",onclick:()=>exportData(false)})]),
    el("button",{text:"استرجاع من نسخة",onclick:()=>file.click()}),file,
    el("button",{class:"danger",text:"امسح كل الداتا",onclick:()=>confirmSheet("تمسح كل الشهور والإعدادات؟ مش هينفع ترجعها.","امسح الكل",()=>{D=defaultData();ensureMonth(CUR);curKey=CUR;save();tab="month";render()})})]));
  main.appendChild(el("p",{class:"muted",style:"text-align:center;font-size:.75rem",text:"مصروفي 1.1"}));
}
function load2(){const def=defaultData();D.settings=Object.assign(def.settings,D.settings||{});D.settings.prices=Object.assign(def.settings.prices,D.settings.prices||{});D.family=D.family||[];D.goal=D.goal||def.goal;ensureMonth(CUR)}
function exportData(toDownloads){
  saveNow();const s=JSON.stringify(D,null,1),name=`masrofy-backup-${mkey(NOW)}-${NOW.getDate()}.json`;
  if(Bridge){if(toDownloads){const ok=Bridge.saveToDownloads(s,name);toast(ok?"اتحفظت في Downloads":"ما اتحفظتش، جرّب «ابعت نسخة»")}else Bridge.share(s,name)}
  else webExport(s,name,!toDownloads);
}
/* iPhone / browser: share sheet (Save to Files, WhatsApp…) or a plain download */
async function webExport(text,name,preferShare){
  const blob=new Blob([text],{type:"application/json"});
  try{
    const f=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"نسخة مصروفي"});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("اتنزلت النسخة");
}
function applyTheme(){const t=D.settings.theme;if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}

/* ================= sheets ================= */
const stack=[];
function openSheet(build){const scrim=el("div",{class:"scrim",onclick:e=>{if(e.target===scrim)closeSheet()}});const sh=el("div",{class:"sheet",role:"dialog"});scrim.appendChild(sh);build(sh);$("#layer").appendChild(scrim);stack.push(scrim)}
function closeSheet(){const s=stack.pop();if(s)s.remove()}
window.onBack=function(){if(stack.length){closeSheet();return true}if(editMode){editMode=false;render();return true}if(tab!=="month"||curKey!==CUR){tab="month";curKey=CUR;render();return true}return false};
function confirmSheet(msg,okText,fn){openSheet(sh=>{sh.appendChild(el("h2",{text:msg}));sh.appendChild(el("div",{class:"grid2"},[el("button",{text:"لأ",onclick:closeSheet}),el("button",{class:"primary",style:"background:var(--danger);border-color:var(--danger)",text:okText,onclick:()=>{closeSheet();fn()}})]))})}
function addSheet(itemId){
  const m=M();let expr="",sel=itemId||null;
  openSheet(sh=>{
    sh.appendChild(el("div",{class:"hd"},[el("h2",{text:"مصروف جديد"}),el("button",{class:"ghost",text:"إلغاء",onclick:closeSheet})]));
    const ex=el("div",{class:"expr"}),rs=el("div",{class:"res num",text:"0"});
    sh.appendChild(el("div",{class:"display"},[ex,rs]));
    const upd=()=>{ex.textContent=expr.replace(/\*/g,"×").replace(/\//g,"÷");const v=calcExpr(expr);rs.textContent=isNaN(v)?"…":fmt(v)};
    const K=(t,cls,fn)=>el("button",{class:cls||"",text:t,onclick:fn||(()=>{expr+=t;upd()})});
    const op=o=>()=>{if(/[+\-*/]$/.test(expr))expr=expr.slice(0,-1);expr+=o;upd()};
    sh.appendChild(el("div",{class:"keys"},[
      K("7"),K("8"),K("9"),K("÷","op",op("/")),K("4"),K("5"),K("6"),K("×","op",op("*")),K("1"),K("2"),K("3"),K("−","op",op("-")),
      K("C","op",()=>{expr="";upd()}),K("0"),K("⌫","op",()=>{expr=expr.slice(0,-1);upd()}),K("+","op",op("+"))]));
    const chips=el("div",{class:"chips"});
    const items=[];m.groups.forEach(g=>g.items.forEach(it=>items.push(it)));
    const drawChips=()=>{chips.textContent="";items.forEach(it=>chips.appendChild(el("button",{"aria-pressed":sel===it.id?"true":"false",text:it.name,onclick:()=>{sel=it.id;drawChips()}})))};drawChips();
    sh.appendChild(el("h3",{text:"على أنهي بند؟"}));sh.appendChild(chips);
    const note=el("input",{placeholder:"ملاحظة (اختياري)"});sh.appendChild(note);
    sh.appendChild(el("button",{class:"primary",text:"سجّل",onclick:()=>{const v=calcExpr(expr);if(!v||isNaN(v)){toast("اكتب المبلغ");return}if(!sel){toast("اختار البند");return}
      m.entries.push({id:uid(),item:sel,amount:v,note:note.value.trim(),at:new Date().toISOString()});save();closeSheet();render();toast(`اتسجل ${fmt(v)}`)}}));
  });
}
function entriesSheet(it){
  const m=M();
  openSheet(sh=>{
    const list=m.entries.filter(e=>e.item===it.id).sort((a,b)=>b.at<a.at?-1:1);
    sh.appendChild(el("div",{class:"hd"},[el("h2",{text:it.name}),el("button",{class:"ghost",text:"قفل",onclick:closeSheet})]));
    const box=el("div",{class:"entries"});
    list.forEach(e=>{const d=new Date(e.at);box.appendChild(el("div",{class:"entry"},[el("div",{},[el("b",{class:"num",text:fmt(e.amount)}),el("small",{class:"muted",text:`  ${d.getDate()}/${d.getMonth()+1}${e.note?" · "+e.note:""}`})]),
      el("button",{class:"x",text:"×","aria-label":"امسح",onclick:()=>{m.entries=m.entries.filter(x=>x!==e);save();closeSheet();render();if(m.entries.some(x=>x.item===it.id))entriesSheet(it)}})]))});
    sh.appendChild(box);
    sh.appendChild(el("button",{class:"primary",text:"+ ضيف مصروف هنا",onclick:()=>{closeSheet();addSheet(it.id)}}));
  });
}

/* ================= AI (optional, needs the user's own API key) ================= */
window.__httpCb={};
window.__http=function(id,status,text){const f=window.__httpCb[id];delete window.__httpCb[id];if(f)f(status,text)};
function post(url,headers,body){return new Promise(res=>{
  if(Bridge&&Bridge.httpPost){const id=uid();window.__httpCb[id]=(s,t)=>res({status:s,text:t});Bridge.httpPost(url,JSON.stringify(headers),body,id)}
  else fetch(url,{method:"POST",headers,body}).then(async r=>res({status:r.status,text:await r.text()})).catch(e=>res({status:0,text:String(e)}));
})}
async function claude(prompt,useSearch){
  const key=D.settings.apiKey;if(!key)throw new Error("حط مفتاح الـAPI الأول");
  const body={model:"claude-sonnet-5-5",max_tokens:2000,messages:[{role:"user",content:prompt}]};
  if(useSearch)body.tools=[{type:"web_search_20250305",name:"web_search",max_uses:6}];
  const r=await post("https://api.anthropic.com/v1/messages",{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},JSON.stringify(body));
  let j;try{j=JSON.parse(r.text)}catch(e){throw new Error("مفيش رد. اتأكد من النت")}
  if(r.status!==200)throw new Error((j.error&&j.error.message)||("خطأ "+r.status));
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}
async function aiPrices(out){
  out.hidden=false;out.textContent="بيدوّر على الأسعار… ممكن ياخد دقيقة";
  const keys=PRICE_DEFS.map(([k,t])=>`${k}: ${t}`).join("\n");
  try{
    const txt=await claude(`ابحث على النت عن أحدث أسعار المستهلك في مصر النهارده بالجنيه المصري للسلع دي، واستخدم أحدث مصادر إخبارية مصرية:\n${keys}\n\nرد بـ JSON بس من غير أي كلام تاني، المفاتيح بالإنجليزي زي ما هي والقيم أرقام، وضيف مفتاح "note" فيه تاريخ الأسعار بالعربي في جملة قصيرة.`,true);
    const mt=txt.match(/\{[\s\S]*\}/);if(!mt)throw new Error("الرد مش مفهوم");
    const obj=JSON.parse(mt[0]);let n=0;
    PRICE_DEFS.forEach(([k])=>{const v=+obj[k];if(v>0){D.settings.prices[k]=Math.round(v*100)/100;n++}});
    if(obj.note)D.settings.pricesNote=String(obj.note).slice(0,80);
    save();render();toast(`اتحدّث ${n} سعر`);
  }catch(e){out.textContent=e.message}
}
async function aiReview(out){
  out.hidden=false;out.textContent="بيراجع…";
  const m=M(),c=calc(m),est=estimates();
  const lines=m.groups.map((g,i)=>`${g.name}: ${g.items.map(it=>`${it.name} ${val(it.plan)}`).join("، ")}`).join("\n");
  const fam=D.family.map(p=>`${p.name||"فرد"} ${p.age} سنة`).join("، ")||"مش محدد";
  try{
    const txt=await claude(`أنا في مصر. ده ملخص ميزانيتي لشهر ${mlabel(curKey)}:\nالدخل ${fmt(c.income)}، التوفير ${val(m.savingsPct)}%، الحد الأقصى للصرف ${D.settings.spendLimitPct}% من الدخل.\nالأسرة: ${fam}.\nالمعقول المحسوب للأكل: ${est?JSON.stringify(est):"غير متاح"}.\nالبنود:\n${lines}\nاتصرف لحد دلوقتي ${fmt(c.actual)}.\n\nراجعها بالعامية المصرية في 6 نقط قصيرة بالكتير: فين الصرف عالي، وأنهي بند أوفر فيه وأد إيه بالظبط، وهل نسبة التوفير والأقساط معقولة. من غير مقدمات.`,false);
    out.textContent=txt;
  }catch(e){out.textContent=e.message}
}
